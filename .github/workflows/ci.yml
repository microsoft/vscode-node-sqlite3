name: Electron CI

on:
  push:
    branches: [ release/vscode ]
  pull_request:

permissions: {}

jobs:
  posix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        persist-credentials: false
    - run: npm ci
    - run: scripts/test-electron.sh
  windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        persist-credentials: false
    - run: npm ci
    - run: .\scripts\test-electron.bat
